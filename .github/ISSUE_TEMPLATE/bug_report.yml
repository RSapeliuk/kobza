name: Bug report
description: Report a bug in Kobza

body:
  - type: markdown
    attributes:
      value: |
        When reporting bugs, please follow the guidelines in this template. This helps identify the problem precisely and thus enables contributors to fix it faster.
        - Write a descriptive issue title above.
        - The golden rule is to **always open *one* issue for *one* bug**. If you notice several bugs and want to report them, make sure to create one new issue for each of them.
        - Search [open](https://github.com/RSapeliuk/kobza/issues) and [closed](https://github.com/RSapeliuk/kobza/issues?q=is%3Aissue+is%3Aclosed) issues to ensure it has not already been reported.
        - Please check if your issue is reproducible on the latest `master` branch – it may already have been fixed!
        - If you use any C++ modules, GDExtensions, or editor plugins, check if the bug is reproducible in a project without these.

  - type: textarea
    attributes:
      label: Tested versions
      description: |
        - Specify the version you found the issue in, including the **Git commit hash**. The exact version can be copied by clicking the version shown in the editor (bottom bar) or in the project manager (top bar).
        - If you can, test earlier versions too and mention whether the bug is reproducible in them, so we can tell whether it's a **regression**.
      placeholder: |

        - Reproducible in: master [d76c1d0e5]
        - Not reproducible in: master [0b806ee0f]
    validations:
      required: true

  - type: input
    attributes:
      label: System information
      description: |
        - Specify the OS version, and when relevant hardware information.
        - For graphics-related issues, specify the GPU model, driver version, and the rendering backend.
        - You can copy this information to your clipboard by using *Help > Copy System Info* at the top of the editor window.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Issue description
      description: |
        Describe your issue briefly. What doesn't work, and how do you expect it to work instead?
        Please do not add code examples or error messages as screenshots, but as text.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: |
        List of steps or sample code that reproduces the issue.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Minimal reproduction project (MRP)
      description: |
        - A small project which reproduces the issue, with no unnecessary files included.
        - If the reproduction steps are not project dependent (e.g. the bug is visible in a brand new project), you can write "N/A" in the field.
        - Drag and drop a ZIP archive to upload it (max 10 MB).
    validations:
      required: true
